spring.application.name=TrainNow-Comunicaciones
server.port=8084

# Base de datos MySQL (Laragon: root sin contraseña, puerto 3306) - db: trainingnow_comunicaciones
spring.datasource.url=jdbc:mysql://localhost:3306/trainingnow_comunicaciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI: http://localhost:8084/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=tn-rutinas
server.port=8083

# Base de datos MySQL (Laragon: root sin contraseña, puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/rutinas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

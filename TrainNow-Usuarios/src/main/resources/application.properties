spring.application.name=TrainNow-Usuarios
server.port=8081

# Base de datos MySQL (Laragon: root sin contraseña, puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ===== EmailJS (recuperacion de contrasena) =====
# enabled=false -> modo dev: el codigo se imprime en la consola del servicio
emailjs.enabled=false
emailjs.service-id=
emailjs.template-id=
emailjs.public-key=
emailjs.private-key=
